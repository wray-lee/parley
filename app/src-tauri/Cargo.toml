[package]
name = "parley"
version = "0.0.2"
description = "Parley app shell: the same web client, hosted in a Tauri v2 WebView"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "parley_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-http = "=2.8.3"
tauri-plugin-websocket = "=2.5.0"
tauri-plugin-tts = "=0.2.1"
tauri-plugin-secure-keystore = "=0.0.3-beta.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
