# Parley Server Host: the Go app behind Caddy.
#
#   docker compose -f deploy/compose.yaml up -d --build
#
# No .env is fine: every Provider falls back to mock (Demo Mode). Deploy
# details, CA trust and the bare-metal alternative are in deploy/README.md.
name: parley

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    # Optional so a fresh clone with no .env still starts. Every variable is
    # documented in .env.example.
    env_file:
      - path: ../.env
        required: false
    expose:
      - "3000"
    restart: unless-stopped
    healthcheck:
      # Distroless has no shell or Bun; the server binary probes itself.
      test: ["CMD", "/app/parley-server", "-healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    # Compose interpolation does not read ../.env, so pass it explicitly when
    # PUBLIC_DOMAIN is set: docker compose --env-file ../.env up -d
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

  # Optional local model sidecars: docker compose --profile local up -d.
  # T08 (WhisperLiveKit) and T06 (Kokoro) own the real service bodies, images
  # and model caches; until then these stubs reserve the names/ports only.
  # Point WHISPERLIVEKIT_URL / KOKORO_URL at them in .env. Ollama stays
  # external: set LLM_BASE_URL to it.
  whisperlivekit:
    profiles: ["local"]
    image: parley-whisperlivekit:local
    expose:
      - "8000"

  kokoro:
    profiles: ["local"]
    image: parley-kokoro:local
    expose:
      - "8880"

volumes:
  caddy_data:
  caddy_config:
