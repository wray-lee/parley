name: Release

# Human-gated: this workflow never creates a tag. Push an existing v* tag to
# publish a release, or dispatch it manually for a dry run that uploads the
# artefacts to the workflow run only. See docs/release.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.26.5'
  BUN_VERSION: '1.4.3'
  FLUTTER_VERSION: '3.47.8'
  ANDROID_NDK_VERSION: '28.2.13676358'
  GOMOBILE_VERSION: 'v0.0.0-20261011034528-197770444867'
  # Public fingerprint of the retained v0.0.2 signing key. Not a secret.
  EXPECTED_ANDROID_CERT_SHA256: eb1f6f0dbcd938b34f8db1ebaeb0ba0304a67b60312bc24b18e6c69d282333e8

jobs:
  guard:
    name: Version, tag and signing guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        name: Version formula and tag policy
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            bash scripts/version.sh --tag "$GITHUB_REF_NAME" --github-output "$GITHUB_OUTPUT"
          else
            # Tags are human-gated. A dry run must not race a human-created tag.
            bash scripts/version.sh --require-tag-absent --github-output "$GITHUB_OUTPUT"
          fi

      - name: Refuse to overwrite a published release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "::error::release $GITHUB_REF_NAME is already published"
            exit 1
          fi

      - name: Require the Android signing secrets for a tagged release
        if: github.event_name == 'push'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::repository secret for $name is not set; a tagged release needs the existing ANDROID_* signing secrets"
              exit 1
            fi
          done

  binaries:
    name: Static server binaries
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build linux amd64/arm64, darwin arm64, windows amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/arm64 windows/amd64; do
            os=${target%/*}
            arch=${target#*/}
            out="parley-server-${os}-${arch}"
            [ "$os" = windows ] && out="${out}.exe"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "dist/$out" ./cmd/parley-server
            tar -czf "dist/parley-server-${os}-${arch}.tar.gz" -C dist "$out"
            rm "dist/$out"
          done
          file dist/*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: dist/*.tar.gz
          if-no-files-found: error

  image:
    name: Distroless server image
    needs: [guard, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: web
          path: dist
      - name: Extract the Flutter web bundle into the image context
        run: |
          mkdir -p web-app
          tar -xzf dist/parley-*-web.tar.gz -C web-app
      - name: Build the distroless image from deploy/
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: docker build -f deploy/Dockerfile -t "parley-server:${VERSION}" .

      - name: Smoke the image on /healthz
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          docker run -d --name parley-release-smoke -p 127.0.0.1:3000:3000 "parley-server:${VERSION}"
          ok=
          for _ in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/healthz > /dev/null; then ok=1; break; fi
            sleep 1
          done
          docker logs parley-release-smoke
          docker stop parley-release-smoke
          [ -n "$ok" ] || { echo '::error::the image did not answer /healthz'; exit 1; }

      - name: Save the image for the release
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          docker save "parley-server:${VERSION}" | gzip > "dist/parley-server-${VERSION}-image.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: dist/*-image.tar.gz
          if-no-files-found: error

  web:
    name: Flutter web bundle
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - name: Build web (self-hosted CanvasKit)
        run: flutter build web --release --no-web-resources-cdn
        working-directory: client
      - name: Mirror the Noto CJK fallback slices
        run: node scripts/self-host-fallback-fonts.mjs client/build/web
      - name: Browser smoke (CSP, same-origin, /lite, no gstatic)
        run: node scripts/web-release-gate.mjs client/build/web
      - name: Brotli size budget (3.5 MiB, including cold-load fonts)
        run: node scripts/web-size-budget.mjs client/build/web 3.5 client/build/web-fonts-used.json
      - name: Package the web bundle
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir -p dist
          tar -czf "dist/parley-${VERSION}-web.tar.gz" -C client/build/web .
      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: dist/parley-*-web.tar.gz
          if-no-files-found: error

  android:
    name: Signed arm64 APK
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      GOMOBILE_TARGET: android/arm64
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Decode the release keystore outside the repository
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.keystore"
            chmod 600 "$RUNNER_TEMP/keys/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keys/release.keystore" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "::error::a tagged release requires the ANDROID_KEYSTORE_* secrets"
            exit 1
          else
            echo "::warning::dry run without signing secrets; the APK will be debug-signed"
            echo "SIGNED=false" >> "$GITHUB_ENV"
          fi

      - name: Install NDK r28
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "ndk;$ANDROID_NDK_VERSION" "build-tools;37.0.0" "platforms;android-37.0" > /dev/null

      - name: Install pinned gomobile
        run: |
          go install "golang.org/x/mobile/cmd/gomobile@${GOMOBILE_VERSION}"
          go install "golang.org/x/mobile/cmd/gobind@${GOMOBILE_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile bind -target=android/arm64 -androidapi 24
        run: bash scripts/build-parley-core-android.sh

      - run: flutter pub get
        working-directory: client

      - name: flutter build apk --release (arm64)
        run: flutter build apk --release --target-platform android-arm64
        working-directory: client

      - name: Verify package id, versionCode, 16 KiB alignment and certificate
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          apk=client/build/app/outputs/flutter-apk/app-release.apk
          args=(--apk "$apk" --version-code "${{ needs.guard.outputs.version_code }}")
          if [ "$SIGNED" = true ]; then
            args+=(--cert-sha256 "$EXPECTED_ANDROID_CERT_SHA256")
          fi
          bash scripts/check-apk.sh "${args[@]}"
          mkdir -p dist
          suffix=arm64
          [ "$SIGNED" = true ] || suffix=arm64-debug
          cp "$apk" "dist/parley-${VERSION}-${suffix}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/parley-*-arm64*.apk
          if-no-files-found: error

  ios:
    name: Unsigned IPA
    needs: guard
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: client
      - name: flutter build ios --release --no-codesign
        run: flutter build ios --release --no-codesign
        working-directory: client
      - name: Package the unsigned IPA
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          mkdir -p dist Payload
          cp -R client/build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/parley-${VERSION}-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: dist/parley-*-unsigned.ipa
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [guard, binaries, image, web, android, ios]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Compose release notes
        env:
          VERSION: ${{ needs.guard.outputs.version }}
          VERSION_CODE: ${{ needs.guard.outputs.version_code }}
          CERT_SHA256: ${{ env.EXPECTED_ANDROID_CERT_SHA256 }}
        run: |
          cat > notes.md <<EOF
          ## Parley ${VERSION}

          The APK is arm64 only, application id \`app.parley.translate\`, versionCode ${VERSION_CODE}.

          **Upgrading from v0.0.2**
          - Keys and settings must be re-entered once after upgrading.
          - Uninstall any debug-signed Parley build before installing this APK. Debug and release builds use different signing keys, so Android refuses to install one over the other.

          **Artefacts**
          - \`parley-${VERSION}-arm64.apk\` — signed with the retained v0.0.2 key (certificate SHA-256 \`${CERT_SHA256}\`).
          - \`parley-${VERSION}-unsigned.ipa\` — install with AltStore/SideStore.
          - \`parley-${VERSION}-web.tar.gz\` — Flutter web bundle (self-hosted CanvasKit and Noto CJK slices), served at \`/\`; extract it to \`web-app/\` next to a bare-metal server or use the release image. The vanilla client stays at \`/lite\`.
          - \`parley-server-<os>-<arch>.tar.gz\` — static server binaries (linux amd64/arm64, darwin arm64, windows amd64).
          - \`parley-server-${VERSION}-image.tar.gz\` — distroless image, \`docker load\` it.

          ## SHA-256
          EOF
          (cd dist && sha256sum *) >> notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          # This job has no checkout; gh needs the repository explicitly.
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.guard.outputs.tag }}
          TITLE: Parley ${{ needs.guard.outputs.version }}
        run: gh release create "$TAG" --verify-tag --title "$TITLE" --notes-file notes.md dist/*
