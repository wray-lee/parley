name: Release

# Triggered by a version tag (human-gated: never push a tag without explicit
# authorisation) or manually for a dry run that uploads workflow artefacts only.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # All PENDING-USER. Empty until the user creates them; the job then falls
      # back to a debug-signed APK. See docs/release.md.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Free disk space (the builder image is ~8.5 GB)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af

      - name: Build APK in the Android builder image
        run: |
          set -euo pipefail
          version=$(bun -p "require('./app/src-tauri/tauri.conf.json').version")
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/out"

          docker build -f app/android-builder.Dockerfile -t parley-android-builder:local app

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/keys/release.keystore"
            chmod 600 "$RUNNER_TEMP/keys/release.keystore"
          fi

          # shortcut: the builder image is rebuilt on every run (~2 GB download);
          # move it to GHCR if release runs become frequent.
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$RUNNER_TEMP/keys:/keys" \
            -v "$RUNNER_TEMP/out:/out" \
            -e ANDROID_KEYSTORE_BASE64 \
            -e ANDROID_KEYSTORE_PASSWORD \
            -e ANDROID_KEY_ALIAS \
            -e ANDROID_KEY_PASSWORD \
            -w /work/app \
            parley-android-builder:local bash -c '
              set -euo pipefail
              bun install --frozen-lockfile
              bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
              if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
                bunx tauri android build --apk -t aarch64
                apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -print -quit)
                test -n "$apk"
                "$bt/zipalign" -f -p 4 "$apk" /tmp/aligned.apk
                "$bt/apksigner" sign \
                  --ks /keys/release.keystore --ks-key-alias "$ANDROID_KEY_ALIAS" \
                  --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
                  --key-pass env:ANDROID_KEY_PASSWORD \
                  --out /out/parley.apk /tmp/aligned.apk
              else
                mkdir -p /root/.android
                keytool -genkeypair -keystore /root/.android/debug.keystore \
                  -storepass android -keypass android -alias androiddebugkey \
                  -keyalg RSA -keysize 2048 -validity 10000 \
                  -dname "CN=Android Debug,O=Android,C=US"
                bunx tauri android build --apk --debug -t aarch64
                apk=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -print -quit)
                test -n "$apk"
                cp "$apk" /out/parley.apk
              fi
              "$bt/apksigner" verify --print-certs /out/parley.apk
              "$bt/aapt2" dump badging /out/parley.apk > /tmp/badging.txt
              "$bt/aapt2" dump permissions /out/parley.apk > /tmp/permissions.txt
              grep -q "app.parley.translate" /tmp/badging.txt
              grep -q "android.permission.RECORD_AUDIO" /tmp/permissions.txt
              echo "apk verified"
            '

      - name: Name APK and checksum
        run: |
          set -euo pipefail
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            apk="parley-$VERSION-arm64.apk"
          else
            apk="parley-$VERSION-arm64-debug.apk"
          fi
          mv "$RUNNER_TEMP/out/parley.apk" "$RUNNER_TEMP/out/$apk"
          (cd "$RUNNER_TEMP/out" && sha256sum "$apk" > "$apk.sha256")
          cat "$RUNNER_TEMP/out/$apk.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  ios:
    runs-on: macos-latest
    env:
      # All PENDING-USER. When these are set the job builds a signed IPA; until
      # then it builds an unsigned IPA for AltStore/SideStore. See docs/release.md.
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-app-${{ hashFiles('app/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-app-

      - name: Install Rust iOS target
        run: rustup target add aarch64-apple-ios

      - name: Install app dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - name: Import signing certificate (optional)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/parley-signing.keychain-db"
          keychain_password="$(openssl rand -hex 16)"
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/parley.mobileprovision"

      - name: Build IPA
        working-directory: app
        run: |
          set -euo pipefail
          # The iOS Xcode project is generated, not committed (unlike gen/android).
          if [ ! -d src-tauri/gen/apple ]; then
            bunx tauri ios init --ci
          fi
          if [ -n "${APPLE_CERTIFICATE_BASE64:-}" ]; then
            bunx tauri ios build --ci --export-method debugging
            suffix=""
          else
            bunx tauri ios build --no-sign --ci
            suffix="-unsigned"
          fi
          ipa=$(find src-tauri/gen/apple/build -name "*.ipa" > "$RUNNER_TEMP/ipas.txt"; head -n 1 "$RUNNER_TEMP/ipas.txt")
          test -n "$ipa"
          unzip -l "$ipa" > "$RUNNER_TEMP/ipa-list.txt"
          grep -q "Payload/.*\.app/" "$RUNNER_TEMP/ipa-list.txt"
          version=$(bun -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p "$RUNNER_TEMP/out"
          cp "$ipa" "$RUNNER_TEMP/out/parley-$version$suffix.ipa"
          (cd "$RUNNER_TEMP/out" && shasum -a 256 "parley-$version$suffix.ipa" \
            > "parley-$version$suffix.ipa.sha256")
          cat "$RUNNER_TEMP/out/parley-$version$suffix.ipa.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error

  release:
    # A tag push is the only path that publishes. Manual runs stop at artefacts.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          notes=$(cat <<EOF
          Parley $TAG

          - Android: signed APK (debug-signed until the release keystore secrets are configured). Install it directly on the phone.
          - iOS: IPA (unsigned in the default channel), install it with AltStore or SideStore, which re-sign it with your Apple ID.

          Sideloading instructions: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/blob/$TAG/docs/release.md#sideloading
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "Parley $TAG" --notes "$notes"
          fi
