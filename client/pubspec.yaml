name: parley
description: Parley's Flutter client for Android, iOS and web.
publish_to: 'none'
version: 0.1.0+1000

environment:
  sdk: ^3.13.7

dependencies:
  audio_session: 0.2.4
  cupertino_icons: 1.0.9
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: 11.2.0
  flutter_soloud: 5.2.2
  flutter_tts: 4.2.5
  http: ^1.2.0
  intl: 0.20.3
  material_ui: 1.8.0
  record: 7.1.2
  wakelock_plus: 1.8.2
  web: ^1.1.0
  web_socket_channel: 3.0.3

dev_dependencies:
  fake_async: 1.3.3
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true
  assets:
    # Copy of config/presets.json; settings_controller_test asserts they match.
    - assets/config/presets.json
