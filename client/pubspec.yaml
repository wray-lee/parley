publish_to: 'none'
version: 0.1.0+1000

environment:
  sdk: ^3.13.7

dependencies:
  audio_session: 0.2.4
  cupertino_icons: 1.0.9
  flutter:
    sdk: flutter
  flutter_soloud: 5.2.2
  http: ^1.2.0
  material_ui: 1.8.0
